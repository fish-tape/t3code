name: Sync upstream T3 Code

on:
  schedule:
    # Daily. A run that cannot land the merge files the issue the weekly
    # Fish Tape upstream monitor resolves.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: pingdotgg/t3code
      ISSUE_TITLE: Upstream T3 Code sync conflict
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that change .github/workflows, and
          # upstream changes them often. UPSTREAM_SYNC_TOKEN (contents and
          # workflows write on this repository) lets the push through; without
          # it, those pushes are refused and reported below.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream main
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          echo "upstream-sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already current with upstream."
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            {
              echo "reason=conflict"
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          fi

          if ! git push origin HEAD:main; then
            echo "reason=push-refused" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Report a sync that could not land
        if: steps.merge.outputs.reason != ''
        shell: bash
        env:
          REASON: ${{ steps.merge.outputs.reason }}
          FILES: ${{ steps.merge.outputs.files }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/upstream-sync.md"
          {
            echo "The upstream sync could not land \`${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}\` on \`main\`."
            echo
            if [ "$REASON" = "conflict" ]; then
              echo "The merge conflicts in:"
              echo
              printf '%s\n' "$FILES" | sed 's/^/- `/; s/$/`/'
            else
              echo "The merge was clean, but pushing it to \`main\` was refused. This usually means upstream"
              echo "changed \`.github/workflows\` and the \`UPSTREAM_SYNC_TOKEN\` secret is missing or lacks"
              echo "workflows write access."
            fi
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Merge \`upstream/main\` into \`main\` without rewriting history, keeping the Fish Tape"
            echo "provider preset, then close this issue."
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          existing="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')"
          # One open issue at a time; later runs only fail until it is closed.
          if [ -z "$existing" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$body"
          fi
          echo "::error::The upstream T3 Code sync could not land (${REASON})."
          exit 1
