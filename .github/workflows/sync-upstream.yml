name: Sync upstream T3 Code

on:
  # The Fish Tape upstream poller dispatches this workflow after it observes a
  # new upstream commit. Keeping the merge logic here makes the GitHub token
  # and conflict reporting local to the fork.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: pingdotgg/t3code
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already-current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor HEAD upstream/main; then
            git reset --hard upstream/main
          elif ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin HEAD:main

      - name: Report a merge conflict
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        run: |
          set -euo pipefail
          title="Upstream T3 Code sync conflict"
          existing="$(gh issue list --state open --search \"$title in:title\" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            body="$RUNNER_TEMP/upstream-sync-conflict.md"
            cat > "$body" <<'EOF'
          The scheduled upstream sync could not merge `pingdotgg/t3code:main` into this fork.

          Update the Fish Tape provider changes against the latest upstream T3 Code commit, then
          close this issue so the next scheduled run can resume automatic syncing.
          EOF
            gh issue create --title "$title" --body-file "$body"
          fi
          echo "::error::Upstream T3 Code changes conflict with the Fish Tape fork."
          exit 1
